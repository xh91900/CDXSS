name: Deploy Webpack to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # ❌删掉原来 cache: 'npm'，这里不能用自动cache

      # 手动缓存，指向子项目目录
      - name: Cache npm dependencies
        uses: actions/cache@v3
        with:
          path: ./convenience-store-simulator/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('./convenience-store-simulator/package-lock.json') }}

      - name: Enter project folder & install dependencies
        run: |
          cd convenience-store-simulator
          npm install

      - name: Webpack production build
        run: |
          cd convenience-store-simulator
          npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./convenience-store-simulator/dist